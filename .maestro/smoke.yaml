# Smoke test: the app launches on Ideas, both tabs render, a setting can be changed, and a quick-capture
# recording opens the project with its timeline. The microphone prompt is accepted if it appears.
# Run with `npm run e2e` (see scripts/e2e.mjs). Docs: https://docs.maestro.dev
appId: ${APP_ID}
name: Smoke
---
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible: 'Record new idea'
    timeout: 60000
- takeScreenshot: ideas

- tapOn: 'Settings'
- assertVisible: 'Version'
- tapOn: 'Dark'
- assertVisible: 'Variant'
- takeScreenshot: settings-dark

# Leave the app as we found it.
- tapOn: 'System'

# Quick capture: record a short idea, stop, and land on its timeline.
- tapOn: 'Ideas'
- tapOn: 'Record new idea'
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- extendedWaitUntil:
    visible: 'Stop recording'
    timeout: 15000
- tapOn: 'Stop recording'
- extendedWaitUntil:
    visible: 'Timeline.*'
    timeout: 15000
- assertVisible: 'Play'
- takeScreenshot: project-timeline
